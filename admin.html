<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onivista Agro | Admin Reviews</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f3;color:#17352a}.wrap{max-width:1000px;margin:30px auto;padding:0 20px}.top{display:flex;align-items:center;gap:14px;background:#fff;padding:18px 22px;border-radius:18px;border:1px solid #dfe9e2}.top img{width:62px;height:62px;object-fit:contain;border-radius:12px}.box{background:#fff;padding:24px;border-radius:18px;margin-top:18px;border:1px solid #dfe9e2}input{padding:12px;border:1px solid #ccd9d1;border-radius:10px;width:280px;max-width:100%;box-sizing:border-box}button{padding:10px 15px;border:0;border-radius:9px;background:#0b6b45;color:#fff;cursor:pointer;margin:4px}.reject{background:#b34b3f}.delete{background:#555}.review{border-top:1px solid #e5ece7;padding:18px 0}.stars{color:#e58224}.muted{color:#66756d}.ok{color:#0b6b45;font-weight:bold}.err{color:#b34b3f;font-weight:bold}.status{font-weight:bold;text-transform:capitalize}</style></head><body><div class="wrap"><div class="top"><img src="onivista-logo.jpg" alt="Onivista Agro logo"><div><h1 style="margin:0">Onivista Agro</h1><p class="muted" style="margin:5px 0">Customer Review Administration</p></div></div><div class="box"><h2>Admin Login</h2><p class="muted">Use the project password to manage customer reviews.</p><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button id="loginBtn">Login</button><button id="refreshBtn">Refresh</button><span id="msg"></span></div><div id="list" class="box">Login to load reviews.</div></div><script>let pw='';const msg=document.getElementById('msg');document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.getElementById('loginBtn').onclick=load;document.getElementById('refreshBtn').onclick=load;async function load(){const p=document.getElementById('password').value.trim();if(!p&& !pw){msg.className='err';msg.textContent=' Enter password.';return;}if(p)pw=p;msg.className='';msg.textContent=' Connecting...';try{const r=await fetch('/api/admin/reviews',{headers:{'X-Admin-Password':pw},cache:'no-store'});const d=await r.json();if(!r.ok){msg.className='err';msg.textContent=' '+(d.error||'Login failed');return;}msg.className='ok';msg.textContent=' Login successful';render(d.reviews||[])}catch(e){msg.className='err';msg.textContent=' Cannot connect. Start the Java server and use http://localhost:3000/admin.html';}}function render(rs){const el=document.getElementById('list');if(!rs.length){el.innerHTML='<h2>Reviews</h2><p class="muted">No reviews submitted yet.</p>';return;}el.innerHTML='<h2>Reviews</h2>'+rs.map(r=>`<div class="review"><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><h3>${esc(r.name)}</h3><p>${esc(r.review)}</p><p class="muted">${new Date(r.createdAt).toLocaleString()} · <span class="status">${esc(r.status)}</span></p><button onclick="setStatus('${encodeURIComponent(r.id)}','approved')">Approve</button><button class="reject" onclick="setStatus('${encodeURIComponent(r.id)}','rejected')">Reject</button><button onclick="setStatus('${encodeURIComponent(r.id)}','pending')">Pending</button><button class="delete" onclick="del('${encodeURIComponent(r.id)}')">Delete</button></div>`).join('')}async function setStatus(id,status){try{const r=await fetch('/api/admin/reviews/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Password':pw},body:JSON.stringify({status})});if(!r.ok)throw new Error((await r.json()).error||'Update failed');load()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete this review?'))return;const r=await fetch('/api/admin/reviews/'+id,{method:'DELETE',headers:{'X-Admin-Password':pw}});if(r.ok)load();else alert('Delete failed')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
